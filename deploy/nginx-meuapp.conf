# MeuApp — HTTP porta 80 (Nginx → Gunicorn). Não redireciona para HTTPS.
# HTTPS na 443 fica no Caddy (deploy/Caddyfile) porque o MinIO já usa essa porta.
# Preserva X-Forwarded-Proto quando o Caddy termina o TLS.
# Instalar:
#   sudo cp deploy/nginx-meuapp.conf /etc/nginx/sites-available/meuapp
#   sudo nginx -t && sudo systemctl reload nginx

upstream meuapp_gunicorn {
    server unix:/home/administrador/meuapp/meuapp.sock fail_timeout=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $meuapp_fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name 192.168.0.253 187.111.15.85 serverlinux localhost;

    client_max_body_size 64m;

    location /static {
        alias /home/administrador/meuapp/static;
        expires 7d;
        access_log off;
    }

    location / {
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $meuapp_fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_pass http://meuapp_gunicorn;
    }
}
