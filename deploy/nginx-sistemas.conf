# Nginx — sistemas.saogeraldoservice.com (HTTP + HTTPS)
# Instalado por scripts/ensure_https.sh. Upstream = Gunicorn via socket.

server {
    listen 80;
    listen [::]:80;
    server_name sistemas.saogeraldoservice.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sistemas.saogeraldoservice.com;

    ssl_certificate     /etc/letsencrypt/live/sistemas.saogeraldoservice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemas.saogeraldoservice.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 40m;

    location / {
        proxy_pass http://unix:/home/administrador/meuapp/meuapp.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }
}
