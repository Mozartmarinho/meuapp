# HTTPS direto no Nginx — só use se a porta 443 NÃO estiver no Caddy.
# Neste servidor a 443 é do Caddy; prefira deploy/Caddyfile + scripts/enable_https.sh.

server {
    listen 192.168.0.253:443 ssl http2;
    server_name 192.168.0.253 187.111.15.85 serverlinux localhost;

    ssl_certificate     /home/administrador/meuapp/certs/fullchain.pem;
    ssl_certificate_key /home/administrador/meuapp/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 64m;

    location /static/ {
        alias /home/administrador/meuapp/static/;
        expires 7d;
        access_log off;
    }

    location / {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_pass http://unix:/home/administrador/meuapp/meuapp.sock;
    }
}
