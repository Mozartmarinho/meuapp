{% extends "base.html" %}

{% block title %}Novo Equipamento - São Geraldo Service{% endblock %}

{% block content %}
<div class="container">
    <div class="header">
        <h1>Novo Equipamento</h1>
        <a href="{{ url_for('main.listar_equipamentos') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <form method="POST" class="form-container">
        <div class="form-group">
            <label for="nome_equipamento">Nome do Equipamento *</label>
            <input type="text" id="nome_equipamento" name="nome_equipamento" required>
        </div>

        <div class="form-group">
            <label for="modelo">Modelo</label>
            <input type="text" id="modelo" name="modelo">
        </div>

        <div class="form-group">
            <label for="numero_serie">Número de Série</label>
            <input type="text" id="numero_serie" name="numero_serie">
        </div>

        <div class="form-group">
            <label for="patrimonio">Patrimônio</label>
            <input type="text" id="patrimonio" name="patrimonio">
        </div>

        <div class="form-group">
            <label for="localizacao">Localização</label>
            <select id="localizacao" name="localizacao">
                <option value="">Selecione um cliente</option>
                {% for cliente in clientes %}
                <option value="{{ cliente.nome }}">{{ cliente.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="data_compra">Data de Compra</label>
            <input type="date" id="data_compra" name="data_compra">
        </div>

        <div class="form-group">
            <label for="data_manutencao">Data de Manutenção</label>
            <input type="date" id="data_manutencao" name="data_manutencao">
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="ativo" name="ativo" checked>
                Equipamento Ativo
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Criar Equipamento
            </button>
        </div>
    </form>
</div>

<style>
.container { padding: 20px 0; max-width: 700px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 1rem; flex-wrap: wrap; }
.header h1 { margin: 0; }
.checkbox-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
.checkbox-label input[type="checkbox"] { width: auto; }
.form-actions { text-align: right; margin-top: 20px; }
</style>
{% endblock %}
