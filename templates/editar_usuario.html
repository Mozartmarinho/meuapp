{% extends "base.html" %}

{% block title %}Editar Usuário - São Geraldo Service{% endblock %}

{% block content %}
<div class="container">
    <div class="header">
        <h1>Editar Usuário</h1>
        <a href="{{ url_for('main.listar_usuarios') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <form method="POST" class="form-container">
        <div class="form-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" name="nome" value="{{ usuario.nome }}" required>
        </div>

        <div class="form-group">
            <label for="email">Email (Login) *</label>
            <input type="email" id="email" name="email" value="{{ usuario.email }}" required>
        </div>

        <div class="form-group">
            <label for="senha">Nova Senha (deixe em branco para manter a atual)</label>
            <input type="password" id="senha" name="senha" minlength="6" placeholder="Deixe vazio para não alterar">
        </div>

        <div class="form-group">
            <label for="tipo">Tipo de Usuário</label>
            <select id="tipo" name="tipo">
                <option value="operador" {% if usuario.tipo == 'operador' %}selected{% endif %}>Operador</option>
                <option value="admin" {% if usuario.tipo == 'admin' %}selected{% endif %}>Administrador</option>
            </select>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="ativo" name="ativo" {% if usuario.ativo %}checked{% endif %}>
                Usuário Ativo
            </label>
        </div>

        <div class="form-group">
            <label>Abas liberadas no sistema de chamados</label>
            {% for menu_key, menu_nome in menus_chamados %}
            <label class="checkbox-label" style="display:flex;align-items:center;margin-bottom:8px;gap:8px">
                <input type="checkbox" name="menu_chamados_{{ menu_key }}" {% if permissoes.get(menu_key, true) %}checked{% endif %}>
                {{ menu_nome }}
            </label>
            {% endfor %}
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Atualizar Usuário
            </button>
        </div>
    </form>
</div>

<style>
.container { padding: 20px 0; max-width: 700px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 1rem; flex-wrap: wrap; }
.header h1 { margin: 0; }
.checkbox-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
.checkbox-label input[type="checkbox"] { width: auto; }
.form-actions { text-align: right; margin-top: 20px; }
</style>
{% endblock %}
