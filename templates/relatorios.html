{% extends "base.html" %}
{% block title %}Relatórios{% endblock %}
{% block content %}
<div class="mdk-rel-cat">
    <h1>Relatórios</h1>
    {% for cat in catalogo %}
    <section class="mdk-rel-acc{% if loop.first %} is-open{% endif %}" data-rel-acc>
        <button type="button" class="mdk-rel-acc-h" aria-expanded="{{ 'true' if loop.first else 'false' }}">
            <i class="fas {{ cat.icon }}"></i>
            <span>{{ cat.label }}</span>
            <i class="fas fa-chevron-down mdk-rel-chev"></i>
        </button>
        <div class="mdk-rel-acc-b"{% if not loop.first %} hidden{% endif %}>
            <div class="mdk-rel-links">
                {% for item in cat['items'] %}
                <a href="{{ url_for('main.relatorio_item', slug=item.slug) }}">{{ item.label }}</a>
                {% endfor %}
            </div>
        </div>
    </section>
    {% endfor %}
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
    document.querySelectorAll('[data-rel-acc]').forEach(function (acc) {
        acc.querySelector('.mdk-rel-acc-h').addEventListener('click', function () {
            const open = acc.classList.contains('is-open');
            acc.classList.toggle('is-open', !open);
            const body = acc.querySelector('.mdk-rel-acc-b');
            body.hidden = open;
            this.setAttribute('aria-expanded', open ? 'false' : 'true');
        });
    });
})();
</script>
{% endblock %}
