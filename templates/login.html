<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - São Geraldo Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="brand-mark" aria-hidden="true">
                    <div class="combo">
                        <i class="fas fa-clipboard-list"></i>
                        <i class="fas fa-apple-whole"></i>
                    </div>
                </div>
                <h1>São Geraldo Service</h1>
                <p>Gestão de Chamados · Nutrição Hospitalar</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('main.login') }}">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>

            <div class="login-footer">
                <p>© São Geraldo Service</p>
            </div>
        </div>
    </div>

    <style>
        :root {
            --navy: #0f2a5c;
            --navy-deep: #0a1c3d;
            --lime: #8fbf2f;
            --lime-soft: #c5e078;
            --muted: #5a6b85;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background:
                radial-gradient(ellipse 70% 50% at 15% 20%, rgba(143, 191, 47, 0.2), transparent 55%),
                radial-gradient(ellipse 60% 45% at 85% 75%, rgba(15, 42, 92, 0.18), transparent 50%),
                linear-gradient(160deg, #f7fafc 0%, #e8eef6 50%, #d5e2f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(15, 42, 92, 0.12);
            border: 1px solid rgba(15, 42, 92, 0.08);
            padding: 40px 36px;
            backdrop-filter: blur(8px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            border-radius: 20px;
            background: linear-gradient(145deg, var(--navy) 0%, var(--navy-deep) 100%);
            box-shadow: 0 12px 28px rgba(15, 42, 92, 0.28);
            display: grid;
            place-items: center;
            position: relative;
        }

        .brand-mark::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 24px;
            border: 2px solid rgba(143, 191, 47, 0.45);
        }

        .combo {
            position: relative;
            width: 44px;
            height: 44px;
        }

        .combo .fa-clipboard-list {
            font-size: 1.7rem;
            color: #fff;
            position: absolute;
            left: 2px;
            top: 6px;
        }

        .combo .fa-apple-whole {
            font-size: 1.15rem;
            color: var(--lime-soft);
            position: absolute;
            right: 0;
            bottom: 2px;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
        }

        .login-header h1 {
            margin: 0;
            color: var(--navy);
            font-family: 'Fraunces', serif;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .login-header p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--navy);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(15, 42, 92, 0.15);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            background: #fff;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(15, 42, 92, 0.12);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--navy);
            color: white;
            width: 100%;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .btn-primary:hover {
            background: var(--navy-deep);
            transform: translateY(-1px);
        }

        .btn-block {
            display: block;
            width: 100%;
        }

        .alert {
            padding: 10px 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        .alert-success {
            background-color: #eaf6d8;
            color: #3d6410;
            border: 1px solid #c5e078;
        }

        .alert-error {
            background-color: #fde8e8;
            color: #8a1f1f;
            border: 1px solid #f5c2c2;
        }

        .login-footer {
            text-align: center;
            margin-top: 28px;
            color: var(--muted);
            font-size: 0.85rem;
        }
    </style>
</body>
</html>
