<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - São Geraldo Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <img class="login-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="São Geraldo Service">
                <p class="tagline">TRANSFORMANDO VIDAS</p>
                <p class="subtitle">Gestão de Chamados · Nutrição Hospitalar</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('main.login') }}">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>

            <div class="login-footer">
                <p>© São Geraldo Service</p>
            </div>
        </div>
    </div>

    <style>
        :root {
            --brand-blue: #1B4F9C;
            --brand-navy: #0D2B5C;
            --brand-lime: #A8C53A;
            --muted: #5a6b85;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Manrope', sans-serif;
            background:
                radial-gradient(ellipse 70% 50% at 12% 18%, rgba(168, 197, 58, 0.22), transparent 55%),
                radial-gradient(ellipse 60% 45% at 88% 78%, rgba(27, 79, 156, 0.18), transparent 50%),
                linear-gradient(160deg, #f7fafc 0%, #e8eef6 50%, #d5e2f2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.94);
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(13, 43, 92, 0.12);
            border: 1px solid rgba(27, 79, 156, 0.1);
            padding: clamp(1.5rem, 4vw, 2.4rem);
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .login-logo {
            width: min(100%, 280px);
            height: auto;
            display: block;
            margin: 0 auto 0.75rem;
            border-radius: 12px;
            overflow: hidden;
        }

        .tagline {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 0.16em;
            color: var(--brand-navy);
            font-size: 0.95rem;
        }

        .subtitle {
            margin: 0.35rem 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .form-group { margin-bottom: 1rem; }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--brand-navy);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 0.9rem;
            border: 1px solid rgba(27, 79, 156, 0.18);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--brand-blue);
            box-shadow: 0 0 0 3px rgba(27, 79, 156, 0.14);
        }

        .btn {
            width: 100%;
            padding: 0.85rem 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            background: var(--brand-blue);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
        }

        .btn:hover { background: var(--brand-navy); }

        .alert {
            padding: 0.7rem 0.85rem;
            margin-bottom: 1rem;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        .alert-success {
            background: #eef8d8;
            color: #3f6410;
            border: 1px solid var(--brand-lime);
        }

        .alert-error {
            background: #fde8e8;
            color: #8a1f1f;
            border: 1px solid #f5c2c2;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.4rem;
            color: var(--muted);
            font-size: 0.85rem;
        }
    </style>
</body>
</html>
