{% extends "base.html" %}

{% block title %}Novo Usuário - São Geraldo Service{% endblock %}

{% block content %}
<div class="container">
    <div class="header">
        <h1>Novo Usuário</h1>
        <a href="{{ url_for('main.listar_usuarios') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <form method="POST" class="form-container">
        <div class="form-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="form-group">
            <label for="email">Email (Login) *</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha *</label>
            <input type="password" id="senha" name="senha" required minlength="6">
        </div>

        <div class="form-group">
            <label for="tipo">Tipo de Usuário</label>
            <select id="tipo" name="tipo">
                <option value="operador">Operador</option>
                <option value="admin">Administrador</option>
            </select>
        </div>

        <div class="form-group">
            <label>Abas liberadas no sistema de chamados</label>
            <p style="margin:0 0 10px;color:#666;font-size:13px">Vinculado ao e-mail principal cadastrado em Opções &gt; Acessos.</p>
            {% for menu_key, menu_nome in menus_chamados %}
            <label class="checkbox-label" style="display:flex;align-items:center;margin-bottom:8px;gap:8px">
                <input type="checkbox" name="menu_chamados_{{ menu_key }}" checked>
                {{ menu_nome }}
            </label>
            {% endfor %}
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Criar Usuário
            </button>
        </div>
    </form>
</div>

<style>
.container { padding: 20px 0; max-width: 700px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 1rem; flex-wrap: wrap; }
.header h1 { margin: 0; }
.form-actions { text-align: right; margin-top: 20px; }
</style>
{% endblock %}
