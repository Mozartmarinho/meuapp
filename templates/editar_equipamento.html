{% extends "base.html" %}

{% block title %}Editar Equipamento - São Geraldo Service{% endblock %}

{% block content %}
<div class="container">
    <div class="form-header">
        <a href="{{ url_for('main.listar_equipamentos') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
        <h1>Editar Equipamento</h1>
    </div>

    <form method="POST" class="form-container">
        <div class="form-group">
            <label for="equipamento">Nome do Equipamento *</label>
            <input type="text" id="equipamento" name="equipamento" value="{{ equipamento.nome_equipamento }}" required>
        </div>

        <div class="form-group">
            <label for="modelo">Modelo</label>
            <input type="text" id="modelo" name="modelo" value="{{ equipamento.modelo or '' }}">
        </div>

        <div class="form-group">
            <label for="patrimonio">Patrimônio</label>
            <input type="text" id="patrimonio" name="patrimonio" value="{{ equipamento.patrimonio or '' }}">
        </div>

        <div class="form-group">
            <label for="cliente_id">Cliente *</label>
            <select id="cliente_id" name="cliente_id" required>
                <option value="">Selecione um cliente</option>
                {% for cliente in clientes %}
                <option value="{{ cliente.id }}" {% if equipamento.cliente_id == cliente.id %}selected{% endif %}>{{ cliente.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="data_compra">Data de Compra</label>
            <input type="date" id="data_compra" name="data_compra" value="{{ equipamento.data_compra.strftime('%Y-%m-%d') if equipamento.data_compra else '' }}">
        </div>

        <div class="form-group">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes" rows="4">{{ equipamento.observacoes or '' }}</textarea>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="ativo" name="ativo" {% if equipamento.ativo %}checked{% endif %}>
                Equipamento Ativo
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Atualizar Equipamento
            </button>
        </div>
    </form>
</div>

<style>
    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
    }

    .form-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .form-header h1 {
        margin: 0;
        color: #333;
    }

    .form-container {
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #333;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
        box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 5px rgba(0,123,255,0.3);
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        font-weight: 500;
        color: #333;
        cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
        width: auto;
        margin-right: 10px;
    }

    .btn {
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.3s;
        display: inline-flex;
        align-items: center;
    }

    .btn-secondary {
        background-color: #6c757d;
        color: white;
    }

    .btn-secondary:hover {
        background-color: #5a6268;
    }

    .btn-success {
        background-color: #28a745;
        color: white;
    }

    .btn-success:hover {
        background-color: #218838;
    }

    .form-actions {
        text-align: right;
        margin-top: 30px;
    }
</style>
{% endblock %}
