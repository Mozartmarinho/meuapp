{% extends "base.html" %}

{% block title %}Novo Chamado - São Geraldo Service{% endblock %}

{% block content %}
<div class="novo-chamado-page">
<div class="nc-header">
    <h1>Novo Chamado</h1>
    <a href="{{ url_for('main.listar_chamados') }}" class="btn nc-btn-muted">
        <i class="fas fa-times"></i> Fechar
    </a>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('main.novo_chamado') }}">
        <input type="hidden" name="status" value="{{ status_inicial|default('Pendente') }}">
        <div class="form-group">
            <label for="cliente_id">Cliente *</label>
            <select id="cliente_id" name="cliente_id" required>
                <option value="">Selecione um cliente...</option>
                {% for cliente in clientes %}
                <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="patrimonio">Patrimônio</label>
            <select id="patrimonio" name="patrimonio" disabled>
                <option value="">Selecione um cliente primeiro</option>
            </select>
            <input type="hidden" id="equipamento_id" name="equipamento_id" value="">
        </div>

        <div class="form-group">
            <label for="equipamento">Equipamento</label>
            <input type="text" id="equipamento" name="equipamento" readonly placeholder="Nome preenchido pelo patrimônio">
        </div>

        <div class="form-group">
            <label for="tipo_servico">Tipo de Serviço *</label>
            <select id="tipo_servico" name="tipo_servico" required>
                <option value="">Selecione...</option>
                <option value="Manutenção">Manutenção</option>
                <option value="Instalação">Instalação</option>
                <option value="Reparo">Reparo</option>
                <option value="Configuração">Configuração</option>
                <option value="Outro">Outro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição *</label>
            <textarea id="descricao" name="descricao" rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label for="setor_tecnico_id">Setor</label>
            <select id="setor_tecnico_id" name="setor_tecnico_id">
                <option value="">Selecione o setor...</option>
                {% for setor in setores_tecnicos %}
                <option value="{{ setor.id }}">{{ setor.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="mesa_id">Mesa de serviço</label>
            <select id="mesa_id" name="mesa_id">
                {% for m in mesas %}
                <option value="{{ m.id }}" {% if mesa_padrao_id == m.id %}selected{% endif %}>{{ m.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="prioridade">Prioridade</label>
            <select id="prioridade" name="prioridade">
                <option value="Normal">Normal</option>
                <option value="Alta">Alta</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
            </select>
        </div>

        <div class="form-group">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes" rows="2"></textarea>
        </div>

        <div class="nc-actions">
            <button type="reset" class="btn nc-btn-muted">
                <i class="fas fa-undo"></i> Limpar
            </button>
            <a href="{{ url_for('main.listar_chamados') }}" class="btn nc-btn-muted">
                <i class="fas fa-times"></i> Fechar
            </a>
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Gravar
            </button>
        </div>
    </form>
</div>
</div>

<style>
.novo-chamado-page { font-size: 0.8rem; }
.novo-chamado-page .nc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
}
.novo-chamado-page .nc-header h1 {
    color: var(--gray-800);
    font-size: 1.28rem;
    font-weight: 700;
    line-height: 1.2;
}
.novo-chamado-page .form-container {
    padding: 0.96rem;
    max-width: 512px;
    border-radius: 0.4rem;
}
.novo-chamado-page .form-group { margin-bottom: 0.56rem; }
.novo-chamado-page label {
    font-size: 0.72rem;
    margin-bottom: 0.16rem;
}
.novo-chamado-page input[type="text"],
.novo-chamado-page select,
.novo-chamado-page textarea {
    padding: 0.48rem 0.6rem;
    font-size: 0.8rem;
    border-radius: 0.3rem;
    line-height: 1.35;
}
.novo-chamado-page textarea { min-height: 0; }
.novo-chamado-page input[readonly] { background-color: var(--gray-100); }
.novo-chamado-page .btn {
    gap: 0.32rem;
    padding: 0.45rem 0.8rem;
    font-size: 0.76rem;
    border-radius: 0.3rem;
}
.novo-chamado-page .nc-btn-muted {
    background-color: var(--gray-300);
    color: var(--gray-800);
}
.novo-chamado-page .nc-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.48rem;
    margin-top: 1rem;
    flex-wrap: wrap;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const clienteSelect = document.getElementById('cliente_id');
    const patrimonioSelect = document.getElementById('patrimonio');
    const equipamentoInput = document.getElementById('equipamento');
    const equipamentoIdInput = document.getElementById('equipamento_id');

    function limparPatrimonio(msg) {
        patrimonioSelect.innerHTML = '<option value="">' + (msg || 'Selecione um cliente primeiro') + '</option>';
        patrimonioSelect.disabled = true;
        equipamentoInput.value = '';
        equipamentoIdInput.value = '';
    }

    function aplicarNome() {
        const opt = patrimonioSelect.options[patrimonioSelect.selectedIndex];
        if (opt && opt.value) {
            equipamentoInput.value = opt.getAttribute('data-nome') || '';
            equipamentoIdInput.value = opt.getAttribute('data-id') || '';
        } else {
            equipamentoInput.value = '';
            equipamentoIdInput.value = '';
        }
    }

    function carregarPatrimonios(clienteId) {
        if (!clienteId) {
            limparPatrimonio();
            return;
        }
        patrimonioSelect.disabled = true;
        patrimonioSelect.innerHTML = '<option value="">Carregando...</option>';
        equipamentoInput.value = '';
        equipamentoIdInput.value = '';
        fetch('/api/equipamentos_por_cliente/' + encodeURIComponent(clienteId))
            .then(function (response) { return response.json(); })
            .then(function (data) {
                patrimonioSelect.innerHTML = '<option value="">Selecione um patrimônio...</option>';
                if (!data || !data.length) {
                    patrimonioSelect.innerHTML = '<option value="">Nenhum patrimônio vinculado a este cliente</option>';
                    patrimonioSelect.disabled = true;
                    return;
                }
                data.forEach(function (equip) {
                    const option = document.createElement('option');
                    option.value = equip.patrimonio || '';
                    option.setAttribute('data-id', equip.id);
                    option.setAttribute('data-nome', equip.nome_equipamento || '');
                    option.textContent = equip.patrimonio || '(sem código)';
                    patrimonioSelect.appendChild(option);
                });
                patrimonioSelect.disabled = false;
            })
            .catch(function (error) {
                limparPatrimonio('Erro ao carregar patrimônios');
                console.error('Erro ao buscar equipamentos:', error);
            });
    }

    clienteSelect.addEventListener('change', function() {
        carregarPatrimonios(this.value);
    });
    patrimonioSelect.addEventListener('change', aplicarNome);
    document.querySelector('form').addEventListener('reset', function () {
        setTimeout(function () { limparPatrimonio(); }, 0);
    });
});
</script>

{% endblock %}
