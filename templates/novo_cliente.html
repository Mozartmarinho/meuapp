{% extends "base.html" %}

{% block title %}Novo Cliente - São Geraldo Service{% endblock %}

{% block content %}
<div class="cli-cadastro-page">
    <div class="header">
        <h1>Novo Cliente</h1>
        <a href="{{ url_for('main.listar_clientes') }}" class="btn btn-secondary">
            <i class="fas fa-times"></i> Fechar
        </a>
    </div>

    <div class="form-container">
        <form method="POST" action="{{ url_for('main.novo_cliente') }}">
            <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="responsavel">Responsável</label>
                <input type="text" id="responsavel" name="responsavel">
            </div>

            <div class="form-group">
                <label for="telefone_responsavel">Telefone Responsável</label>
                <input type="tel" id="telefone_responsavel" name="telefone_responsavel">
            </div>

            <div class="form-group">
                <label class="check" style="display:flex;align-items:center;gap:8px;font-weight:600">
                    <input type="checkbox" name="habilitado_chamados" checked>
                    Habilitar para Chamados
                </label>
            </div>
            <div class="form-group">
                <label class="check" style="display:flex;align-items:center;gap:8px;font-weight:600">
                    <input type="checkbox" name="habilitado_nutricao">
                    Habilitar para Nutrição
                </label>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('main.listar_clientes') }}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Fechar
                </a>
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Gravar
                </button>
            </div>
        </form>
    </div>
</div>

<style>
.cli-cadastro-page { font-size: 0.8rem; }
.cli-cadastro-page .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    gap: 0.8rem;
    flex-wrap: wrap;
}
.cli-cadastro-page .header h1 { margin: 0; font-size: 1.28rem; }
.cli-cadastro-page .form-container {
    padding: 0.96rem;
    max-width: 560px;
    border-radius: 0.4rem;
}
.cli-cadastro-page .form-group { margin-bottom: 0.56rem; }
.cli-cadastro-page label { font-size: 0.72rem; margin-bottom: 0.16rem; }
.cli-cadastro-page input[type="text"],
.cli-cadastro-page input[type="tel"] {
    padding: 0.48rem 0.6rem;
    font-size: 0.8rem;
    border-radius: 0.3rem;
    line-height: 1.35;
}
.cli-cadastro-page .btn {
    gap: 0.32rem;
    padding: 0.45rem 0.8rem;
    font-size: 0.76rem;
    border-radius: 0.3rem;
}
.cli-cadastro-page .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.48rem;
    margin-top: 1rem;
}
</style>
{% endblock %}
