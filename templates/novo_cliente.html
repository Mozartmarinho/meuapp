{% extends "base.html" %}

{% block title %}Novo Cliente - São Geraldo Service{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h1>Novo Cliente</h1>
        <a href="{{ url_for('main.listar_clientes') }}" class="btn" style="background-color: var(--gray-300); color: var(--gray-800);">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="form-container">
        <form method="POST" action="{{ url_for('main.novo_cliente') }}">
            <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone">
            </div>

            <div class="form-group">
                <label for="responsavel">Responsável</label>
                <input type="text" id="responsavel" name="responsavel">
            </div>

            <div class="form-group">
                <label for="telefone_responsavel">Telefone Responsável</label>
                <input type="tel" id="telefone_responsavel" name="telefone_responsavel">
            </div>

            <div class="form-group">
                <label for="email_responsavel">Email Responsável</label>
                <input type="email" id="email_responsavel" name="email_responsavel">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Criar Cliente
                </button>
                <a href="{{ url_for('main.listar_clientes') }}" class="btn" style="background-color: var(--gray-300); color: var(--gray-800);">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    .form-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
    }

    .form-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .form-header h1 {
        margin: 0;
        color: #333;
    }

    .form-container {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-weight: 500;
    }

    .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
        box-sizing: border-box;
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
    }

    .btn {
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.3s;
    }

    .btn-success {
        background-color: #28a745;
        color: white;
    }

    .btn-success:hover {
        background-color: #218838;
    }

    .btn {
        background-color: #6c757d;
        color: white;
    }

    .btn:hover {
        background-color: #5a6268;
    }
</style>
{% endblock %}
