{% extends "base.html" %}

{% block title %}Editar Cliente - São Geraldo Service{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h1 style="color: var(--gray-800);">Editar Cliente - {{ cliente.nome }}</h1>
    <a href="{{ url_for('main.listar_clientes') }}" class="btn" style="background-color: var(--gray-300); color: var(--gray-800);">
        <i class="fas fa-arrow-left"></i> Voltar
    </a>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('main.editar_cliente', id=cliente.id) }}">
        <div class="form-group">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" value="{{ cliente.nome }}" required>
        </div>

        <div class="form-group">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" value="{{ cliente.endereco }}">
        </div>

        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" value="{{ cliente.telefone }}">
        </div>

        <div class="form-group">
            <label for="responsavel">Responsável</label>
            <input type="text" id="responsavel" name="responsavel" value="{{ cliente.responsavel }}">
        </div>

        <div class="form-group">
            <label for="telefone_responsavel">Telefone Responsável</label>
            <input type="tel" id="telefone_responsavel" name="telefone_responsavel" value="{{ cliente.telefone_responsavel }}">
        </div>

        <div class="form-group">
            <label for="whatsapp_responsavel">WhatsApp Responsável</label>
            <input type="tel" id="whatsapp_responsavel" name="whatsapp_responsavel" value="{{ cliente.whatsapp_responsavel }}">
        </div>

        <div class="form-group">
            <label for="email_responsavel">Email Responsável</label>
            <input type="email" id="email_responsavel" name="email_responsavel" value="{{ cliente.email_responsavel }}">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
            <a href="{{ url_for('main.listar_clientes') }}" class="btn" style="background-color: var(--gray-300); color: var(--gray-800);">
                <i class="fas fa-times"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Salvar Alterações
            </button>
        </div>
    </form>
</div>
{% endblock %}
