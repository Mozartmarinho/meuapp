{% extends "base_nutricao.html" %}
{% block content %}
<div class="imp-dist">
<div class="page-header">
  <h1>Impressão mapa distribuição</h1>
  <p>Imprime a lista de distribuição por clínica, período e tipo de refeição</p>
</div>

<div class="card imp-panel">
  <fieldset class="imp-box">
    <legend>Filtros</legend>
    <div class="imp-grid">
      <div class="form-group imp-clinicas">
        <label class="form-label" for="fClinicas">Clínicas</label>
        <select class="form-control" id="fClinicas" multiple size="8">
          {% for c in clinicas or [] %}
          <option value="{{ c.nome }}">{{ c.nome }}</option>
          {% endfor %}
        </select>
        <small class="imp-hint">Vazio = todas. Segure Ctrl para selecionar várias.</small>
      </div>
      <div class="imp-lado">
        <div class="form-group">
          <label class="form-label" for="fTipo">Tipo de refeição</label>
          <select class="form-control" id="fTipo">
            {% for t in tipos or [] %}
            <option value="{{ t.chave }}" {% if t.chave == 'almoco' %}selected{% endif %}>{{ t.nome }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="fDe">Período de</label>
          <input class="form-control" type="date" id="fDe" value="{{ data_padrao }}">
        </div>
        <div class="form-group">
          <label class="form-label" for="fAte">até</label>
          <input class="form-control" type="date" id="fAte" value="{{ data_padrao }}">
        </div>
      </div>
    </div>
  </fieldset>

  <div class="imp-actions">
    <button type="button" class="btn btn-primary" onclick="imprimirDistribuicao()">
      <i class="fas fa-print"></i> Imprimir
    </button>
    <button type="button" class="btn btn-ghost" onclick="location.href='{{ url_for('nutricao.dashboard') }}'">
      <i class="fas fa-times"></i> Fechar
    </button>
  </div>
</div>
</div>

<style>
.imp-dist .page-header { margin-bottom: 1rem; }
.imp-dist .page-header h1 { font-size: clamp(1.12rem, 2vw, 1.52rem); }
.imp-dist .page-header p { font-size: 0.76rem; margin-top: 0.2rem; }
.imp-dist .btn { gap: 0.32rem; padding: 0.56rem 1rem; font-size: 0.76rem; border-radius: 0.3rem; }
.imp-dist .form-label { font-size: 0.72rem; margin-bottom: 0.32rem; }
.imp-dist .form-control {
  padding: 0.6rem;
  font-size: 0.8rem;
  border-radius: 0.3rem;
  min-height: 0;
  height: auto;
  line-height: 1.25;
}
.imp-dist .imp-panel { padding: 0.88rem 1rem 1.12rem; max-width: 760px; }
.imp-dist .imp-box {
  border: 1px solid #dbe3ee;
  border-radius: 6px;
  padding: 0.6rem 0.72rem 0.76rem;
  margin: 0 0 0.8rem;
  background: #f8fafc;
}
.imp-dist .imp-box legend { font-size: 0.66rem; font-weight: 700; color: #334155; padding: 0 0.28rem; }
.imp-dist .imp-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 0.9rem;
}
.imp-dist .imp-lado { display: flex; flex-direction: column; gap: 0.7rem; }
.imp-dist #fClinicas { min-height: 10.5rem; }
.imp-dist .imp-hint { display: block; margin-top: 0.28rem; font-size: 0.68rem; color: #64748b; }
.imp-dist .imp-actions { display: flex; gap: 0.44rem; flex-wrap: wrap; }
@media (max-width: 700px) {
  .imp-dist .imp-grid { grid-template-columns: 1fr; }
}
</style>

<script>
function imprimirDistribuicao(){
  const de = document.getElementById('fDe').value;
  const ate = document.getElementById('fAte').value;
  const tipo = document.getElementById('fTipo').value;
  if (!de || !ate){
    showToast('Informe o período','error');
    return;
  }
  if (ate < de){
    showToast('A data final não pode ser menor que a inicial','error');
    return;
  }
  if (!tipo){
    showToast('Selecione o tipo de refeição','error');
    return;
  }
  const qs = new URLSearchParams({ data_de: de, data_ate: ate, tipo: tipo });
  const sel = document.getElementById('fClinicas');
  for (const opt of sel.selectedOptions){
    if (opt.value) qs.append('clinica', opt.value);
  }
  window.open('{{ url_for("nutricao.impressao_mapa_distribuicao_imprimir") }}?' + qs.toString(), '_blank');
}
</script>
{% endblock %}
