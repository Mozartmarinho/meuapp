{% extends "base_nutricao.html" %}
{% block content %}
<div class="page-header">
  <h1>Cadastro de Dietas</h1>
  <p>Grupos/dietas usados no mapa, pacientes e preços das refeições</p>
</div>

<div class="toolbar">
  <div class="toolbar-search">
    <i class="fas fa-search"></i>
    <input type="text" id="buscaDieta" placeholder="Buscar dieta..." oninput="filtrarDietas()">
  </div>
  <button class="btn btn-primary btn-sm" type="button" onclick="abrirDieta()">
    <i class="fas fa-plus"></i> Nova Dieta
  </button>
</div>

<div class="card" style="padding:0;overflow:hidden">
  <div class="table-container" style="box-shadow:none;border-radius:0;">
    <table class="data-table" id="tabelaDietas">
      <thead>
        <tr>
          <th>Nome da Dieta</th>
          <th style="width:180px">Grupo</th>
          <th style="width:90px;text-align:center">Ativo</th>
          <th style="width:170px">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaDietasBody">
        {% for d in dietas %}
        <tr
          data-id="{{ d.id }}"
          data-nome="{{ d.nome }}"
          data-grupo="{{ d.grupo or '' }}"
          data-categoria="{{ d.categoria or 'basica' }}"
          data-ativo="{{ '1' if d.ativo else '0' }}"
          data-precos='{{ (precos_por_dieta.get(d.id) or {})|tojson }}'
        >
          <td>{{ d.nome }}</td>
          <td>{{ d.grupo or '—' }}</td>
          <td style="text-align:center">
            <input type="checkbox" {% if d.ativo %}checked{% endif %} onchange="toggleDietaAtivo({{ d.id }}, this.checked)">
          </td>
          <td class="dieta-acoes">
            <button class="btn btn-ghost btn-sm" type="button" onclick="abrirDietaFromRow(this)" title="Editar">
              <i class="fas fa-edit"></i> Editar
            </button>
            <button class="btn btn-ghost btn-sm" type="button" onclick="excluirDieta({{ d.id }})" title="Excluir">
              <i class="fas fa-trash"></i> Excluir
            </button>
          </td>
        </tr>
        {% else %}
        <tr id="linhaVazia">
          <td colspan="4" style="text-align:center;color:#6B7280;">Nenhuma dieta cadastrada.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<style>
.dieta-acoes {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
  white-space: nowrap;
}
.dieta-precos-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.55rem 0.65rem;
  margin-top: 0.35rem;
}
.dieta-precos-grid .form-group { margin: 0; }
.dieta-precos-grid .form-label {
  font-size: 0.72rem;
  font-weight: 700;
  color: #334155;
  margin-bottom: 0.2rem;
}
.dieta-precos-title {
  margin: 0.85rem 0 0.25rem;
  font-size: 0.82rem;
  font-weight: 800;
  color: #0f2a5c;
}
@media (max-width: 640px) {
  .dieta-precos-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>

<script>
const TIPOS_REF = {{ (tipos or [])|tojson }};
const GRUPOS_DIETA = {{ (grupos or [])|tojson }};

function fmtBR(v){
  const n = Number(v);
  if (!isFinite(n)) return '0,00';
  return n.toFixed(2).replace('.', ',');
}
function parseBR(s){
  const t = String(s || '').trim().replace(/\./g, '').replace(',', '.');
  const n = parseFloat(t);
  return isFinite(n) ? n : 0;
}

function filtrarDietas(){
  const q = (document.getElementById('buscaDieta').value || '').toLowerCase().trim();
  document.querySelectorAll('#tabelaDietasBody tr').forEach(tr => {
    if (tr.id === 'linhaVazia') return;
    const nome = (tr.dataset.nome || '').toLowerCase();
    const grupo = (tr.dataset.grupo || '').toLowerCase();
    const show = !q || nome.includes(q) || grupo.includes(q);
    tr.style.display = show ? '' : 'none';
  });
}

function abrirDietaFromRow(btn){
  const tr = btn.closest('tr');
  let precos = {};
  try { precos = JSON.parse(tr.dataset.precos || '{}'); } catch(e) { precos = {}; }
  abrirDieta({
    id: Number(tr.dataset.id),
    nome: tr.dataset.nome || '',
    grupo: tr.dataset.grupo || '',
    categoria: tr.dataset.categoria || 'basica',
    ativo: tr.dataset.ativo === '1',
    precos
  });
}

function abrirDieta(data){
  const isEdit = !!(data && data.id);
  const precos = (data && data.precos) || {};
  const tiposHtml = (TIPOS_REF || []).map(t => {
    const sig = (t.sigla || '').toUpperCase();
    const val = precos[sig] != null ? precos[sig] : 0;
    return `
      <div class="form-group">
        <label class="form-label" for="f-preco-${sig}">${t.nome} (${sig})</label>
        <input class="form-control f-preco" id="f-preco-${sig}" data-sigla="${sig}"
               inputmode="decimal" value="${fmtBR(val)}" placeholder="0,00">
      </div>`;
  }).join('');

  const cats = [
    ['basica','Básica / Oral'],
    ['enteral','Enteral'],
    ['formula','Fórmula'],
    ['suplemento','Suplemento'],
    ['outro','Outro'],
  ];
  const catOpts = cats.map(([v,l]) =>
    `<option value="${v}" ${(data && data.categoria)===v ? 'selected':''}>${l}</option>`
  ).join('');

  const grupoAtual = (data && data.grupo) ? String(data.grupo) : '';
  const gruposOpts = ['<option value="">— Sem grupo —</option>'].concat(
    (GRUPOS_DIETA || []).map(g => {
      const nome = String(g.nome || '');
      const sel = nome === grupoAtual ? ' selected' : '';
      return `<option value="${nome.replace(/"/g,'&quot;')}"${sel}>${nome.replace(/</g,'&lt;')}</option>`;
    })
  );
  // Se a dieta tem um grupo legado fora da lista ativa, mantém selecionável
  if (grupoAtual && !(GRUPOS_DIETA || []).some(g => String(g.nome || '') === grupoAtual)) {
    gruposOpts.push(
      `<option value="${grupoAtual.replace(/"/g,'&quot;')}" selected>${grupoAtual.replace(/</g,'&lt;')} (legado)</option>`
    );
  }

  const html = `
    <div class="form-group">
      <label class="form-label">Nome da Dieta *</label>
      <input class="form-control" id="f-dieta-nome" value="${(data && data.nome) ? String(data.nome).replace(/"/g,'&quot;') : ''}" placeholder="Ex: DIETA BRANDA">
    </div>
    <div class="form-group">
      <label class="form-label">Grupo</label>
      <select class="form-control" id="f-dieta-grupo">${gruposOpts.join('')}</select>
    </div>
    <div class="form-group">
      <label class="form-label">Categoria</label>
      <select class="form-control" id="f-dieta-categoria">${catOpts}</select>
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:8px;margin-top:12px;">
      <input type="checkbox" id="f-dieta-ativo" ${(data ? data.ativo !== false : true) ? 'checked' : ''}>
      <label class="form-label" for="f-dieta-ativo" style="margin:0">Ativo</label>
    </div>
    <div class="dieta-precos-title">Preços por refeição (R$)</div>
    <div class="dieta-precos-grid">${tiposHtml || '<span style="color:#64748b">Cadastre os tipos de refeição primeiro.</span>'}</div>
  `;
  window._editDietaId = isEdit ? data.id : null;
  abrirModal(isEdit ? 'Editar Dieta' : 'Nova Dieta', html, isEdit ? 'Atualizar' : 'Salvar', salvarDieta);
}

async function salvarDieta(){
  const nome = (document.getElementById('f-dieta-nome')?.value || '').trim();
  if (!nome){ showToast('Informe o nome da dieta','error'); return; }
  const precos = {};
  document.querySelectorAll('.f-preco').forEach(inp => {
    const sig = (inp.dataset.sigla || '').toUpperCase();
    if (sig) precos[sig] = parseBR(inp.value);
  });
  const body = {
    nome,
    grupo: (document.getElementById('f-dieta-grupo')?.value || '').trim(),
    categoria: document.getElementById('f-dieta-categoria')?.value || 'basica',
    ativo: !!document.getElementById('f-dieta-ativo')?.checked,
    precos
  };
  const id = window._editDietaId;
  const url = id ? `/nutricao/api/dietas/${id}` : '/nutricao/api/dietas';
  const method = id ? 'PUT' : 'POST';
  const r = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok || j.ok === false){ showToast((j && j.error) || 'Falha ao salvar','error'); return; }
  fecharModal();
  showToast(id ? 'Dieta atualizada' : 'Dieta cadastrada','success');
  setTimeout(() => location.reload(), 450);
}

async function toggleDietaAtivo(id, ativo){
  const r = await fetch(`/nutricao/api/dietas/${id}`, {
    method: 'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ativo: !!ativo })
  });
  const j = await r.json();
  if (!r.ok || j.ok === false){
    showToast((j && j.error) || 'Falha ao atualizar','error');
    location.reload();
  }
}

async function excluirDieta(id){
  if (!confirm('Excluir esta dieta? Ela será desativada (soft-delete).')) return;
  const r = await fetch(`/nutricao/api/dietas/${id}`, { method:'DELETE' });
  const j = await r.json();
  if (!r.ok || j.ok === false){ showToast((j && j.error) || 'Falha ao excluir','error'); return; }
  showToast('Dieta excluída','success');
  setTimeout(() => location.reload(), 450);
}
</script>
{% endblock %}
