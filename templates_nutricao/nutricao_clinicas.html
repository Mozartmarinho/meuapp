{% extends "base_nutricao.html" %}
{% block content %}
<div class="clinica-cadastro">
<div class="page-header">
  <h1>Cadastro de Clínicas</h1>
  <p>Unidades e setores usados no mapa de produção</p>
</div>

<div class="toolbar">
  <div class="toolbar-search">
    <i class="fas fa-search"></i>
    <input type="text" id="buscaClinica" placeholder="Buscar clínica..." oninput="filtrarClinicas()">
  </div>
  <button class="btn btn-primary btn-sm" type="button" onclick="abrirClinica()">
    <i class="fas fa-plus"></i> Nova Clínica
  </button>
</div>

<div class="card" style="padding:0;overflow:hidden">
  <div class="table-container" style="box-shadow:none;border-radius:0;">
    <table class="data-table" id="tabelaClinicas">
      <thead>
        <tr>
          <th>Clínica</th>
          <th style="width:72px;text-align:center">Ativo</th>
          <th style="width:104px">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaClinicasBody">
        {% for c in clinicas %}
        <tr data-id="{{ c.id }}" data-nome="{{ c.nome }}" data-ativo="{{ '1' if c.ativo else '0' }}">
          <td>{{ c.nome }}</td>
          <td style="text-align:center">
            <input type="checkbox" class="chk-ativo" {% if c.ativo %}checked{% endif %} onchange="toggleAtivo({{ c.id }}, this.checked)">
          </td>
          <td class="clinica-acoes">
            <button class="btn btn-ghost btn-sm" type="button" onclick="location.href='{{ url_for('nutricao.enfermarias') }}?clinica_id={{ c.id }}'" title="Vincular enfermarias">
              <i class="fas fa-link"></i>
            </button>
            <button class="btn btn-ghost btn-sm" type="button" onclick="abrirClinica({id:{{ c.id }}, nome: {{ c.nome|tojson }}, ativo: {{ 'true' if c.ativo else 'false' }}})" title="Editar">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-ghost btn-sm" type="button" onclick="excluirClinica({{ c.id }})" title="Desativar">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
        {% else %}
        <tr id="linhaVazia">
          <td colspan="3" style="text-align:center;color:#6B7280;">Nenhuma clínica cadastrada.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
</div>

<style>
.clinica-cadastro .page-header { margin-bottom: 1rem; }
.clinica-cadastro .page-header h1 { font-size: clamp(1.12rem, 2vw, 1.52rem); }
.clinica-cadastro .page-header p { font-size: 0.76rem; margin-top: 0.2rem; }
.clinica-cadastro .toolbar { gap: 0.6rem; margin-bottom: 0.8rem; }
.clinica-cadastro .toolbar-search {
  gap: 0.4rem;
  padding: 0.44rem 0.68rem;
  max-width: 336px;
  flex-basis: 176px;
}
.clinica-cadastro .toolbar-search i { font-size: 0.72rem; }
.clinica-cadastro .toolbar-search input {
  font-size: 0.72rem;
  padding: 0;
  width: auto;
  border: none;
  box-shadow: none;
}
.clinica-cadastro .btn { gap: 0.32rem; padding: 0.56rem 1rem; font-size: 0.76rem; border-radius: 0.3rem; }
.clinica-cadastro .btn-sm { padding: 0.32rem 0.6rem; font-size: 0.68rem; }
.clinica-cadastro .btn-ghost { padding: 0.16rem 0.32rem; }
.clinica-cadastro .card { padding: 1rem; margin-bottom: 0.8rem; }
.clinica-cadastro .data-table { font-size: 0.8rem; }
.clinica-cadastro .data-table th,
.clinica-cadastro .data-table td {
  padding: 0.22rem 0.64rem;
  font-size: 0.76rem;
  line-height: 1.2;
  vertical-align: middle;
}
.clinica-cadastro .data-table th { font-size: 0.76rem; padding-top: 0.28rem; padding-bottom: 0.28rem; }
.clinica-cadastro .data-table input[type="checkbox"] {
  width: 0.85rem;
  height: 0.85rem;
  margin: 0;
  vertical-align: middle;
}
.clinica-cadastro .clinica-acoes {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: center;
  gap: 0.08rem;
  white-space: nowrap;
}
.clinica-cadastro .clinica-acoes .btn {
  flex-shrink: 0;
  padding: 0.12rem 0.28rem;
  line-height: 1.15;
}
#modalOverlay .modal-dialog { max-width: 512px; }
#modalOverlay .modal-header { padding: 0.92rem 1rem 0; gap: 0.6rem; }
#modalOverlay .modal-header h2 { font-size: 0.96rem; }
#modalOverlay .modal-close { font-size: 1.2rem; }
#modalOverlay .modal-body { padding: 0.8rem 1rem 0.92rem; }
#modalOverlay .modal-footer { gap: 0.4rem; padding: 0.8rem 1rem; }
#modalOverlay .form-label { font-size: 0.72rem; margin-bottom: 0.32rem; }
#modalOverlay .form-control {
  padding: 0.48rem 0.6rem;
  font-size: 0.8rem;
  border-radius: 0.3rem;
  min-height: 0;
  height: auto;
  line-height: 1.25;
}
#modalOverlay .form-control:focus { box-shadow: 0 0 0 2px rgba(27, 79, 156, 0.15); }
#modalOverlay .form-group { margin-bottom: 1rem; }
#modalOverlay .btn { gap: 0.32rem; padding: 0.56rem 1rem; font-size: 0.76rem; border-radius: 0.3rem; }
</style>

<script>
function filtrarClinicas(){
  const q = (document.getElementById('buscaClinica').value || '').toLowerCase().trim();
  document.querySelectorAll('#tabelaClinicasBody tr').forEach(tr => {
    if (tr.id === 'linhaVazia') return;
    const nome = (tr.dataset.nome || tr.textContent || '').toLowerCase();
    tr.style.display = (!q || nome.includes(q)) ? '' : 'none';
  });
}

function abrirClinica(data){
  const isEdit = !!(data && data.id);
  const html = `
    <div class="form-group">
      <label class="form-label">Clínica *</label>
      <input class="form-control" id="f-clinica-nome" value="${(data && data.nome) ? String(data.nome).replace(/"/g,'&quot;') : ''}" placeholder="Ex: CTI - 1">
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:8px;margin-top:12px;">
      <input type="checkbox" id="f-clinica-ativo" ${(data ? data.ativo !== false : true) ? 'checked' : ''}>
      <label class="form-label" for="f-clinica-ativo" style="margin:0">Ativo</label>
    </div>
  `;
  window._editClinicaId = isEdit ? data.id : null;
  abrirModal(isEdit ? 'Editar Clínica' : 'Nova Clínica', html, isEdit ? 'Atualizar' : 'Salvar', salvarClinica);
}

async function salvarClinica(){
  const nome = (document.getElementById('f-clinica-nome')?.value || '').trim();
  if (!nome){
    showToast('Informe o nome da clínica','error');
    return;
  }
  const body = {
    nome,
    ativo: !!document.getElementById('f-clinica-ativo')?.checked
  };
  const id = window._editClinicaId;
  const url = id ? `/nutricao/api/clinicas/${id}` : '/nutricao/api/clinicas';
  const method = id ? 'PUT' : 'POST';
  try {
    const r = await fetch(url, {
      method,
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if (!r.ok || j.ok === false){
      showToast((j && j.error) || 'Falha ao salvar','error');
      return;
    }
    fecharModal();
    showToast(id ? 'Clínica atualizada' : 'Clínica cadastrada','success');
    setTimeout(() => location.reload(), 500);
  } catch (e) {
    showToast('Erro ao salvar clínica','error');
  }
}

async function toggleAtivo(id, ativo){
  try {
    const r = await fetch(`/nutricao/api/clinicas/${id}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ ativo: !!ativo })
    });
    const j = await r.json();
    if (!r.ok || j.ok === false){
      showToast((j && j.error) || 'Falha ao atualizar','error');
      location.reload();
      return;
    }
    const tr = document.querySelector(`#tabelaClinicasBody tr[data-id="${id}"]`);
    if (tr) tr.dataset.ativo = ativo ? '1' : '0';
  } catch (e) {
    showToast('Erro ao atualizar status','error');
    location.reload();
  }
}

async function excluirClinica(id){
  if (!confirm('Desativar esta clínica?')) return;
  try {
    const r = await fetch(`/nutricao/api/clinicas/${id}`, { method: 'DELETE' });
    const j = await r.json();
    if (!r.ok || j.ok === false){
      showToast((j && j.error) || 'Falha ao desativar','error');
      return;
    }
    showToast('Clínica desativada','success');
    setTimeout(() => location.reload(), 500);
  } catch (e) {
    showToast('Erro ao desativar','error');
  }
}
</script>
{% endblock %}
