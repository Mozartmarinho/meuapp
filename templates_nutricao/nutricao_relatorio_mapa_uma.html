{% extends "base_nutricao.html" %}
{% block content %}
<div class="page-header">
  <h1>Impressão do mapa de totalização da U.M.A.</h1>
  <p>Parâmetros para impressão por clínica/enfermaria, categoria e horários</p>
</div>

<div class="card uma-panel">
  <div class="form-group" style="max-width:220px">
    <label class="form-label" for="fData">Data:</label>
    <input class="form-control" type="date" id="fData" value="{{ data_padrao }}">
  </div>

  <fieldset class="uma-box">
    <legend>Imprimir por:</legend>
    <div class="uma-radios">
      <label><input type="radio" name="imprimirPor" value="grupo_clinica" checked onchange="atualizarFiltro()"> Grupo de clínica</label>
      <label><input type="radio" name="imprimirPor" value="clinica" onchange="atualizarFiltro()"> Clínica</label>
      <label><input type="radio" name="imprimirPor" value="enfermaria" onchange="atualizarFiltro()"> Enfermaria</label>
    </div>
    <div class="form-group" style="margin:0.75rem 0 0;max-width:420px">
      <label class="form-label" id="lblFiltro" for="fFiltro">Grupo de clínica:</label>
      <select class="form-control" id="fFiltro"></select>
    </div>
  </fieldset>

  <fieldset class="uma-box">
    <legend>Imprimir</legend>
    <div class="uma-radios uma-cats">
      <label><input type="radio" name="categoria" value="enteral" checked> Enteral</label>
      <label><input type="radio" name="categoria" value="suplementos"> Suplementos</label>
      <label><input type="radio" name="categoria" value="formula_infantil"> Fórm. Infantis</label>
      <label><input type="radio" name="categoria" value="lve"> LVE</label>
    </div>
  </fieldset>

  <fieldset class="uma-box">
    <legend>Horários</legend>
    <div class="uma-horas" id="boxHoras"></div>
    <div class="uma-hora-actions">
      <button type="button" class="btn btn-ghost btn-sm" onclick="setHoras(true)">Marcar todos</button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="setHoras(false)">Limpar</button>
    </div>
  </fieldset>

  <div class="uma-amostra">
    <label><input type="checkbox" id="fAmostra" onchange="toggleAmostra()"> Imprimir amostra</label>
    <input class="form-control" type="number" step="0.01" id="fAmostraVal" value="50.00" disabled style="max-width:120px">
  </div>

  <div class="uma-actions">
    <button type="button" class="btn btn-primary" onclick="imprimir()">
      <i class="fas fa-print"></i> Imprimir
    </button>
    <button type="button" class="btn btn-ghost" onclick="location.href='{{ url_for('nutricao.dashboard') }}'">
      <i class="fas fa-times"></i> Fechar
    </button>
  </div>
</div>

<style>
.uma-panel { padding: 1.1rem 1.25rem 1.4rem; max-width: 720px; }
.uma-box {
  border:1px solid #dbe3ee; border-radius:8px; padding:0.85rem 1rem 1rem;
  margin:0.9rem 0; background:#f8fafc;
}
.uma-box legend { font-size:0.85rem; font-weight:700; color:#334155; padding:0 0.4rem; }
.uma-radios { display:flex; flex-wrap:wrap; gap:0.65rem 1.25rem; }
.uma-radios label { display:flex; align-items:center; gap:0.4rem; font-size:0.92rem; color:#334155; margin:0; }
.uma-cats { gap:0.75rem 1.5rem; }
.uma-horas {
  display:grid; grid-template-columns:repeat(12, minmax(36px, 1fr)); gap:0.35rem;
}
.uma-horas label {
  display:flex; align-items:center; justify-content:center; gap:0.25rem;
  font-size:0.82rem; border:1px solid #dbe3ee; border-radius:6px;
  padding:0.3rem 0.15rem; background:#fff; margin:0;
}
.uma-hora-actions { margin-top:0.55rem; display:flex; gap:0.4rem; }
.uma-amostra {
  display:flex; align-items:center; gap:0.75rem; margin:0.85rem 0 1.1rem;
  font-size:0.92rem; color:#334155;
}
.uma-actions { display:flex; gap:0.6rem; flex-wrap:wrap; }
@media (max-width:700px){
  .uma-horas { grid-template-columns:repeat(6, 1fr); }
}
</style>

<script>
const CLINICAS = {{ clinicas|tojson }};
const ENFERMARIAS = {{ enfermarias|tojson }};

(function buildHoras(){
  const box = document.getElementById('boxHoras');
  let html = '';
  for (let h=1; h<=24; h++){
    html += `<label><input type="checkbox" class="hora-chk" value="${h}"> ${h}</label>`;
  }
  box.innerHTML = html;
  // padrão: marca alguns horários típicos U.M.A.
  [6,8,10,12,14,16,18,20,22].forEach(h => {
    const el = box.querySelector(`.hora-chk[value="${h}"]`);
    if (el) el.checked = true;
  });
})();

function atualizarFiltro(){
  const por = document.querySelector('input[name="imprimirPor"]:checked')?.value || 'grupo_clinica';
  const lbl = document.getElementById('lblFiltro');
  const sel = document.getElementById('fFiltro');
  if (por === 'enfermaria'){
    lbl.textContent = 'Enfermaria:';
    sel.innerHTML = '<option value="">Todas</option>' + ENFERMARIAS.map(e =>
      `<option value="${e.id}" data-nome="${esc(e.nome)}">${esc(e.nome)}</option>`
    ).join('');
  } else {
    lbl.textContent = por === 'clinica' ? 'Clínica:' : 'Grupo de clínica:';
    sel.innerHTML = '<option value="">Todos</option>' + CLINICAS.map(c =>
      `<option value="${c.id}" data-nome="${esc(c.nome)}">${esc(c.nome)}</option>`
    ).join('');
    // seleciona maternidade se existir (exemplo da tela legado)
    const i = [...sel.options].findIndex(o => (o.dataset.nome||'').includes('MATERNIDADE'));
    if (i > 0) sel.selectedIndex = i;
  }
}

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function setHoras(on){
  document.querySelectorAll('.hora-chk').forEach(c => { c.checked = !!on; });
}

function toggleAmostra(){
  document.getElementById('fAmostraVal').disabled = !document.getElementById('fAmostra').checked;
}

function coletar(){
  const por = document.querySelector('input[name="imprimirPor"]:checked')?.value || 'grupo_clinica';
  const sel = document.getElementById('fFiltro');
  const opt = sel.selectedOptions[0];
  const horarios = [...document.querySelectorAll('.hora-chk:checked')].map(c => parseInt(c.value,10));
  return {
    data: document.getElementById('fData').value,
    imprimir_por: por,
    filtro_id: sel.value || null,
    filtro_nome: opt && opt.value ? (opt.dataset.nome || opt.textContent) : '',
    categoria: document.querySelector('input[name="categoria"]:checked')?.value || 'enteral',
    horarios,
    imprimir_amostra: !!document.getElementById('fAmostra').checked,
    amostra_valor: parseFloat(document.getElementById('fAmostraVal').value)||0
  };
}

function imprimir(){
  const p = coletar();
  if (!p.data){ showToast('Informe a data','error'); return; }
  if (!p.horarios.length){ showToast('Selecione ao menos um horário','error'); return; }
  const qs = new URLSearchParams({
    data: p.data,
    categoria: p.categoria,
    imprimir_por: p.imprimir_por,
    filtro_nome: p.filtro_nome || '',
    horarios: p.horarios.join(','),
    imprimir_amostra: p.imprimir_amostra ? '1' : '0',
    amostra_valor: String(p.amostra_valor)
  });
  if (p.filtro_id) qs.set('filtro_id', p.filtro_id);
  window.open('/nutricao/relatorio-mapa-uma/imprimir?' + qs.toString(), '_blank');
}

atualizarFiltro();
toggleAmostra();
</script>
{% endblock %}
