{% extends "base_nutricao.html" %}
{% block content %}
<div class="uma-cadastro">
<div class="page-header">
  <h1>Impressão de Mapas da U.M.A.</h1>
  <p>Enteral, fórmulas infantis, suplementos e LVE</p>
</div>

<div class="card uma-panel">
  <div class="uma-topo">
    <div class="form-group uma-data">
      <label class="form-label" for="fData">Data:</label>
      <input class="form-control" type="date" id="fData" value="{{ data_padrao }}">
    </div>
    <div class="form-group uma-grupo">
      <label class="form-label" for="fGrupo">Grupo de clínica:</label>
      <select class="form-control" id="fGrupo"></select>
    </div>
  </div>

  <fieldset class="uma-box">
    <legend>Imprimir por:</legend>
    <div class="uma-radios">
      <label><input type="radio" name="imprimirPor" value="clinica" checked onchange="atualizarFiltro()"> Clínica</label>
      <label><input type="radio" name="imprimirPor" value="enfermaria" onchange="atualizarFiltro()"> Enfermaria</label>
    </div>
    <div class="form-group uma-filtro">
      <label class="form-label" id="lblFiltro" for="fFiltro">Clínica:</label>
      <select class="form-control" id="fFiltro"></select>
    </div>
  </fieldset>

  <fieldset class="uma-box">
    <legend>Imprimir</legend>
    <div class="uma-radios uma-cats">
      <label><input type="radio" name="categoria" value="enteral" checked> Enteral</label>
      <label><input type="radio" name="categoria" value="suplementos"> Suplementos</label>
      <label><input type="radio" name="categoria" value="formula_infantil"> Fórm. Infantis</label>
      <label><input type="radio" name="categoria" value="lve"> LVE</label>
    </div>
  </fieldset>

  <fieldset class="uma-box">
    <legend>Horários</legend>
    <label class="uma-sel-horas"><input type="checkbox" id="fSelHoras" onchange="toggleHoras()"> Selecionar horários</label>
    <div class="uma-horas" id="boxHoras"></div>
    <div class="uma-hora-actions">
      <button type="button" class="btn btn-ghost btn-sm" onclick="setHoras(true)">Marcar todos</button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="setHoras(false)">Limpar</button>
    </div>
  </fieldset>

  <fieldset class="uma-box">
    <legend>Opções</legend>
    <div class="uma-opcoes">
      <div>
        <div class="uma-opcao-titulo">Coluna extra a exibir</div>
        <div class="uma-radios uma-col">
          <label><input type="radio" name="colunaExtra" value="diagnostico" checked> Diagnóstico</label>
          <label><input type="radio" name="colunaExtra" value="grupo_dieta"> Grupo da dieta</label>
        </div>
      </div>
      <div>
        <div class="uma-opcao-titulo">Sistema</div>
        <div class="uma-radios uma-col">
          <label><input type="radio" name="sistema" value="aberto" checked> Aberto</label>
          <label><input type="radio" name="sistema" value="ambos"> Ambos</label>
          <label><input type="radio" name="sistema" value="fechado"> Fechado</label>
        </div>
      </div>
      <div>
        <div class="uma-opcao-titulo">Tipo de mapa</div>
        <div class="uma-radios uma-col">
          <label><input type="radio" name="tipoMapa" value="trabalho" checked> Trabalho</label>
          <label><input type="radio" name="tipoMapa" value="cobranca"> Cobrança</label>
        </div>
      </div>
      <div>
        <div class="uma-opcao-titulo">Linhas em branco</div>
        <input class="form-control uma-linhas" type="number" id="fLinhasBranco" min="0" max="40" value="0">
      </div>
    </div>
    <div class="uma-checks">
      <label><input type="checkbox" id="fSepararGrupo"> Separar o relatório por grupo de clínica</label>
      <label><input type="checkbox" id="fSemProduto"> Não imprimir o produto</label>
    </div>
  </fieldset>

  <div class="uma-amostra">
    <label><input type="checkbox" id="fAmostra" onchange="toggleAmostra()"> Imprimir amostra</label>
    <input class="form-control" type="number" step="0.01" id="fAmostraVal" value="50.00" disabled>
  </div>

  <div class="uma-actions">
    <button type="button" class="btn btn-primary" onclick="imprimir()">
      <i class="fas fa-print"></i> Imprimir
    </button>
    <button type="button" class="btn btn-ghost" onclick="location.href='{{ url_for('nutricao.dashboard') }}'">
      <i class="fas fa-times"></i> Fechar
    </button>
  </div>
</div>
</div>

<style>
.uma-cadastro .page-header { margin-bottom: 1rem; }
.uma-cadastro .page-header h1 { font-size: clamp(1.12rem, 2vw, 1.52rem); }
.uma-cadastro .page-header p { font-size: 0.76rem; margin-top: 0.2rem; }
.uma-cadastro .btn { gap: 0.32rem; padding: 0.56rem 1rem; font-size: 0.76rem; border-radius: 0.3rem; }
.uma-cadastro .btn-sm { padding: 0.32rem 0.6rem; font-size: 0.68rem; }
.uma-cadastro .form-label { font-size: 0.72rem; margin-bottom: 0.32rem; }
.uma-cadastro .form-control {
  padding: 0.48rem 0.6rem;
  font-size: 0.8rem;
  border-radius: 0.3rem;
  min-height: 0;
  height: auto;
  line-height: 1.25;
}
.uma-cadastro .form-control:focus { box-shadow: 0 0 0 2px rgba(27, 79, 156, 0.15); }
.uma-cadastro .form-group { margin-bottom: 0.8rem; }
.uma-cadastro input[type="radio"],
.uma-cadastro input[type="checkbox"] {
  width: 0.72rem;
  height: 0.72rem;
  margin: 0;
  flex-shrink: 0;
}
.uma-topo { display: flex; flex-wrap: wrap; gap: 0.8rem 1.2rem; }
.uma-data { max-width: 176px; margin-bottom: 0; }
.uma-grupo { flex: 1; min-width: 200px; margin-bottom: 0; }
.uma-filtro { margin: 0.6rem 0 0; max-width: 336px; }
.uma-panel { padding: 0.88rem 1rem 1.12rem; max-width: 760px; }
.uma-box {
  border: 1px solid #dbe3ee; border-radius: 6px; padding: 0.68rem 0.8rem 0.8rem;
  margin: 0.72rem 0; background: #f8fafc;
}
.uma-box legend { font-size: 0.68rem; font-weight: 700; color: #334155; padding: 0 0.32rem; }
.uma-radios { display: flex; flex-wrap: wrap; gap: 0.52rem 1rem; }
.uma-radios label { display: flex; align-items: center; gap: 0.32rem; font-size: 0.74rem; color: #334155; margin: 0; }
.uma-cats { gap: 0.6rem 1.2rem; }
.uma-horas {
  display: grid; grid-template-columns: repeat(12, minmax(29px, 1fr)); gap: 0.28rem;
}
.uma-horas label {
  display: flex; align-items: center; justify-content: center; gap: 0.2rem;
  font-size: 0.66rem; border: 1px solid #dbe3ee; border-radius: 5px;
  padding: 0.24rem 0.12rem; background: #fff; margin: 0;
}
.uma-hora-actions { margin-top: 0.44rem; display: flex; gap: 0.32rem; }
.uma-sel-horas {
  display: flex; align-items: center; gap: 0.32rem;
  font-size: 0.74rem; color: #334155; margin: 0 0 0.48rem;
}
.uma-horas.is-off { opacity: 0.45; }
.uma-opcoes {
  display: grid;
  grid-template-columns: 1.25fr 1fr 0.9fr 0.75fr;
  gap: 0.55rem 0.8rem;
}
.uma-opcao-titulo { font-size: 0.68rem; font-weight: 700; color: #334155; margin-bottom: 0.28rem; }
.uma-col { flex-direction: column; align-items: flex-start; gap: 0.28rem; }
.uma-linhas { max-width: 72px; }
.uma-checks { display: flex; flex-direction: column; gap: 0.36rem; margin-top: 0.62rem; }
.uma-checks label {
  display: flex; align-items: center; gap: 0.32rem;
  font-size: 0.74rem; color: #334155; margin: 0;
}
.uma-amostra {
  display: flex; align-items: center; gap: 0.6rem; margin: 0.68rem 0 0.88rem;
  font-size: 0.74rem; color: #334155;
}
.uma-amostra .form-control { max-width: 96px; }
.uma-actions { display: flex; gap: 0.48rem; flex-wrap: wrap; }
@media (max-width:700px){
  .uma-horas { grid-template-columns: repeat(6, 1fr); }
  .uma-opcoes { grid-template-columns: 1fr 1fr; }
}
</style>

<script>
const CLINICAS = {{ clinicas|tojson }};
const GRUPOS_CLINICA = {{ grupos_clinica|default([])|tojson }};
const ENFERMARIAS = {{ enfermarias|tojson }};

(function buildHoras(){
  const box = document.getElementById('boxHoras');
  let html = '';
  for (let h=1; h<=24; h++){
    html += `<label><input type="checkbox" class="hora-chk" value="${h}"> ${h}</label>`;
  }
  box.innerHTML = html;
})();

function preencherGrupos(){
  const sel = document.getElementById('fGrupo');
  sel.innerHTML = '<option value="">Todos</option>' + (GRUPOS_CLINICA || []).map(g =>
    `<option value="${g.id}" data-nome="${esc(g.nome)}">${esc(g.nome)}</option>`
  ).join('');
}

function toggleHoras(){
  const on = !!document.getElementById('fSelHoras').checked;
  const box = document.getElementById('boxHoras');
  box.classList.toggle('is-off', !on);
  box.querySelectorAll('.hora-chk').forEach(c => { c.disabled = !on; });
}

function atualizarFiltro(){
  const por = document.querySelector('input[name="imprimirPor"]:checked')?.value || 'clinica';
  const lbl = document.getElementById('lblFiltro');
  const sel = document.getElementById('fFiltro');
  if (por === 'enfermaria'){
    lbl.textContent = 'Enfermaria:';
    sel.innerHTML = '<option value="">Todas</option>' + ENFERMARIAS.map(e =>
      `<option value="${e.id}" data-nome="${esc(e.nome)}">${esc(e.nome)}</option>`
    ).join('');
  } else {
    lbl.textContent = 'Clínica:';
    sel.innerHTML = '<option value="">Todos</option>' + CLINICAS.map(c =>
      `<option value="${c.id}" data-nome="${esc(c.nome)}">${esc(c.nome)}</option>`
    ).join('');
  }
}

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function setHoras(on){
  const sel = document.getElementById('fSelHoras');
  if (on && sel && !sel.checked){
    sel.checked = true;
    toggleHoras();
  }
  document.querySelectorAll('.hora-chk').forEach(c => { c.checked = !!on; });
}

function toggleAmostra(){
  document.getElementById('fAmostraVal').disabled = !document.getElementById('fAmostra').checked;
}

function coletar(){
  const por = document.querySelector('input[name="imprimirPor"]:checked')?.value || 'clinica';
  const sel = document.getElementById('fFiltro');
  const opt = sel.selectedOptions[0];
  const gsel = document.getElementById('fGrupo');
  const gopt = gsel.selectedOptions[0];
  const selecionar = !!document.getElementById('fSelHoras').checked;
  const horarios = selecionar
    ? [...document.querySelectorAll('.hora-chk:checked')].map(c => parseInt(c.value,10))
    : [];
  let linhas = parseInt(document.getElementById('fLinhasBranco').value, 10);
  if (!Number.isFinite(linhas) || linhas < 0) linhas = 0;
  if (linhas > 40) linhas = 40;
  return {
    data: document.getElementById('fData').value,
    imprimir_por: por,
    filtro_id: sel.value || null,
    filtro_nome: opt && opt.value ? (opt.dataset.nome || opt.textContent) : '',
    grupo_id: gsel.value || null,
    grupo_nome: gopt && gopt.value ? (gopt.dataset.nome || gopt.textContent) : '',
    categoria: document.querySelector('input[name="categoria"]:checked')?.value || 'enteral',
    selecionar_horarios: selecionar,
    horarios,
    coluna_extra: document.querySelector('input[name="colunaExtra"]:checked')?.value || 'diagnostico',
    sistema: document.querySelector('input[name="sistema"]:checked')?.value || 'aberto',
    tipo_mapa: document.querySelector('input[name="tipoMapa"]:checked')?.value || 'trabalho',
    linhas_em_branco: linhas,
    separar_grupo: !!document.getElementById('fSepararGrupo').checked,
    nao_imprimir_produto: !!document.getElementById('fSemProduto').checked,
    imprimir_amostra: !!document.getElementById('fAmostra').checked,
    amostra_valor: parseFloat(document.getElementById('fAmostraVal').value)||0
  };
}

function imprimir(){
  const p = coletar();
  if (!p.data){ showToast('Informe a data','error'); return; }
  if (p.selecionar_horarios && !p.horarios.length){ showToast('Selecione ao menos um horário','error'); return; }
  const qs = new URLSearchParams({
    data: p.data,
    categoria: p.categoria,
    imprimir_por: p.imprimir_por,
    filtro_nome: p.filtro_nome || '',
    grupo_nome: p.grupo_nome || '',
    selecionar_horarios: p.selecionar_horarios ? '1' : '0',
    horarios: p.horarios.join(','),
    coluna_extra: p.coluna_extra,
    sistema: p.sistema,
    tipo_mapa: p.tipo_mapa,
    linhas_em_branco: String(p.linhas_em_branco),
    separar_grupo: p.separar_grupo ? '1' : '0',
    nao_imprimir_produto: p.nao_imprimir_produto ? '1' : '0',
    imprimir_amostra: p.imprimir_amostra ? '1' : '0',
    amostra_valor: String(p.amostra_valor)
  });
  if (p.filtro_id) qs.set('filtro_id', p.filtro_id);
  if (p.grupo_id) qs.set('grupo_id', p.grupo_id);
  window.open('/nutricao/relatorio-mapa-uma/imprimir?' + qs.toString(), '_blank');
}

preencherGrupos();
atualizarFiltro();
toggleHoras();
toggleAmostra();
</script>
{% endblock %}
