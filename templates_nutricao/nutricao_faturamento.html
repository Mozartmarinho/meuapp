{% extends "base_nutricao.html" %}
{% block content %}
<div class="fat-page">
<div class="page-header">
  <h1>Relatórios do Faturamento</h1>
  <p>Espelho e totais de refeições por clínica e período</p>
</div>

<div class="card fat-panel">
  <fieldset class="fat-box">
    <legend>Período</legend>
    <div class="fat-periodo">
      <div class="form-group" style="margin:0">
        <label class="form-label" for="fDe">De:</label>
        <input class="form-control" type="date" id="fDe" value="{{ data_padrao }}">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label" for="fAte">Até:</label>
        <input class="form-control" type="date" id="fAte" value="{{ data_padrao }}">
      </div>
    </div>
  </fieldset>

  <fieldset class="fat-box">
    <legend>Tipo de relatório</legend>
    <div class="fat-tipos">
      <label><input type="radio" name="tipo" value="espelho_1" checked> Espelho do faturamento - 1ª página</label>
      <label><input type="radio" name="tipo" value="espelho_2"> Espelho do faturamento - 2ª página</label>
      <label><input type="radio" name="tipo" value="total_sem_correcao"> Total de refeições (sem correção)</label>
      <label><input type="radio" name="tipo" value="total_refeicoes"> Total de refeições</label>
      <label><input type="radio" name="tipo" value="total_formulas"> Total de fórmulas infantis e enterais</label>
      <label><input type="radio" name="tipo" value="total_complementares"> Total de refeições complementares</label>
    </div>
  </fieldset>

  <fieldset class="fat-box">
    <legend>Opções</legend>
    <div class="fat-ops">
      <label><input type="checkbox" id="fGrupo"> Por grupo de clínica</label>
      <label><input type="checkbox" id="fSintetico"> Relatório sintético</label>
    </div>
  </fieldset>

  <div class="fat-actions">
    <button type="button" class="btn btn-primary" onclick="exportar()">
      <i class="fas fa-file-excel"></i> Exportar
    </button>
    <button type="button" class="btn btn-primary" onclick="imprimir()">
      <i class="fas fa-print"></i> Imprimir
    </button>
    <button type="button" class="btn btn-ghost" onclick="location.href='{{ url_for('nutricao.dashboard') }}'">
      <i class="fas fa-times"></i> Fechar
    </button>
  </div>
</div>
</div>

<style>
.fat-page .page-header { margin-bottom: 1rem; }
.fat-page .page-header h1 { font-size: clamp(1.12rem, 2vw, 1.52rem); }
.fat-page .page-header p { font-size: 0.76rem; margin-top: 0.2rem; }
.fat-page .btn { gap: 0.32rem; padding: 0.56rem 1rem; font-size: 0.76rem; border-radius: 0.3rem; }
.fat-page .btn-ghost { padding: 0.28rem 0.4rem; }
.fat-page .form-label { font-size: 0.72rem; margin-bottom: 0.32rem; }
.fat-page .form-control {
  padding: 0.6rem;
  font-size: 0.8rem;
  border-radius: 0.3rem;
  min-height: 0;
  height: auto;
  line-height: 1.25;
}
.fat-page .form-control:focus { box-shadow: 0 0 0 2px rgba(27, 79, 156, 0.15); }
.fat-page input[type="radio"],
.fat-page input[type="checkbox"] { width: 0.72rem; height: 0.72rem; margin: 0; flex-shrink: 0; }
.fat-panel { padding: 0.88rem 1rem 1.12rem; max-width: 512px; }
.fat-box {
  border:1px solid #dbe3ee; border-radius:6px; padding:0.68rem 0.8rem 0.8rem;
  margin:0 0 0.72rem; background:#f8fafc;
}
.fat-box legend { font-size:0.68rem; font-weight:700; color:#334155; padding:0 0.32rem; }
.fat-periodo { display:flex; flex-wrap:wrap; gap:0.68rem; }
.fat-periodo .form-control { min-width:128px; }
.fat-tipos { display:flex; flex-direction:column; gap:0.36rem; }
.fat-tipos label, .fat-ops label {
  display:flex; align-items:center; gap:0.36rem;
  font-size:0.74rem; color:#334155; margin:0;
}
.fat-ops { display:flex; flex-direction:column; gap:0.36rem; }
.fat-actions { display:flex; flex-wrap:wrap; gap:0.44rem; margin-top:0.28rem; }
</style>

<script>
function params(){
  const qs = new URLSearchParams({
    data_de: document.getElementById('fDe').value,
    data_ate: document.getElementById('fAte').value,
    tipo: document.querySelector('input[name="tipo"]:checked')?.value || 'espelho_1',
    por_grupo_clinica: document.getElementById('fGrupo').checked ? '1' : '0',
    sintetico: document.getElementById('fSintetico').checked ? '1' : '0'
  });
  return qs;
}

function imprimir(){
  const de = document.getElementById('fDe').value;
  const ate = document.getElementById('fAte').value;
  if (!de || !ate){ showToast('Informe o período','error'); return; }
  window.open('/nutricao/faturamento/imprimir?' + params().toString(), '_blank');
}

function exportar(){
  const de = document.getElementById('fDe').value;
  const ate = document.getElementById('fAte').value;
  if (!de || !ate){ showToast('Informe o período','error'); return; }
  window.location.href = '/nutricao/faturamento/exportar?' + params().toString();
}
</script>
{% endblock %}
