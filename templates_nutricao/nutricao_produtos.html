{% extends "base_nutricao.html" %}
{% block content %}
<div class="prod-cadastro">
<div class="page-header">
  <h1>Cadastro de produtos</h1>
  <p>Unidades, grupos e produtos por estoque</p>
</div>

<div class="card prod-panel">
  <div class="prod-toolbar">
    <div class="prod-actions" id="prodCrudBar">
      <button class="btn btn-primary btn-sm" type="button" onclick="novoItem()" title="Novo"><i class="fas fa-plus"></i></button>
    </div>

    <div class="prod-filters" id="filtrosProdutos">
      <label class="form-label" style="margin:0">Estoque</label>
      <select class="form-control" id="selEstoque" onchange="trocarFiltros()">
        {% for e in estoques %}
        <option value="{{ e.id }}" {% if estoque_id == e.id %}selected{% endif %}>{{ e.nome }}</option>
        {% endfor %}
      </select>
      <label class="form-label" style="margin:0">Localizar grupo</label>
      <select class="form-control" id="selGrupo" onchange="trocarFiltros()">
        <option value="">Todos</option>
        {% for g in grupos if g.ativo %}
        <option value="{{ g.id }}" {% if grupo_id == g.id %}selected{% endif %}>{{ g.nome }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="prod-modos">
      <button type="button" class="modo-btn" id="btnModoUnidades" onclick="setModo('unidades')">
        <i class="fas fa-balance-scale"></i>
        <span>Unidades</span>
      </button>
      <button type="button" class="modo-btn" id="btnModoGrupos" onclick="setModo('grupos')">
        <i class="fas fa-layer-group"></i>
        <span>Grupos</span>
      </button>
      <button type="button" class="modo-btn active" id="btnModoProdutos" onclick="setModo('produtos')">
        <i class="fas fa-apple-alt"></i>
        <span>Produtos</span>
      </button>
    </div>
  </div>

  <div class="table-container" style="box-shadow:none;border:1px solid #e2e8f0;border-radius:6px;max-height:560px;overflow:auto;">
    <table class="data-table" id="gridPrincipal">
      <thead id="gridHead"></thead>
      <tbody id="gridBody"></tbody>
    </table>
  </div>
</div>
</div>

<style>
.prod-cadastro .page-header { margin-bottom: 1rem; }
.prod-cadastro .page-header h1 { font-size: clamp(1.12rem, 2vw, 1.52rem); }
.prod-cadastro .page-header p { font-size: 0.76rem; margin-top: 0.2rem; }
.prod-cadastro .btn { gap: 0.32rem; padding: 0.56rem 1rem; font-size: 0.76rem; border-radius: 0.3rem; }
.prod-cadastro .btn-sm { padding: 0.32rem 0.6rem; font-size: 0.68rem; }
.prod-cadastro .btn-ghost { padding: 0.28rem 0.4rem; }
.prod-cadastro .form-label { font-size: 0.72rem; margin-bottom: 0; }
.prod-cadastro .form-control {
  padding: 0.48rem 0.6rem;
  font-size: 0.8rem;
  border-radius: 0.3rem;
  min-height: 0;
  height: auto;
  line-height: 1.25;
}
.prod-cadastro .form-control:focus { box-shadow: 0 0 0 2px rgba(27, 79, 156, 0.15); }
.prod-cadastro .data-table { font-size: 0.72rem; }
.prod-cadastro .data-table th,
.prod-cadastro .data-table td { padding: 0.28rem 0.4rem; font-size: 0.72rem; line-height: 1.2; }
.prod-cadastro .data-table th { font-size: 0.68rem; }
.prod-cadastro .prod-actions .btn-sm { padding: 0.24rem 0.36rem; }
.prod-cadastro .prod-actions .btn-sm i { font-size: 0.72rem; }
.prod-cadastro input[type="checkbox"] { width: 0.72rem; height: 0.72rem; margin: 0; }
.prod-panel { padding: 0.72rem 0.8rem 0.96rem; }
.prod-toolbar {
  display:flex; flex-wrap:wrap; gap:0.6rem 0.8rem; align-items:flex-end;
  margin-bottom:0.72rem;
}
.prod-actions { display:flex; gap:0.24rem; align-items:center; }
.prod-filters {
  display:flex; flex-wrap:wrap; gap:0.32rem 0.48rem; align-items:center;
}
.prod-filters .form-control { width:auto; min-width:112px; padding: 0.32rem 0.48rem; font-size: 0.76rem; }
.prod-modos { display:flex; gap:0.36rem; margin-left:auto; }
.modo-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:0.2rem; min-width:62px; padding:0.44rem 0.52rem;
  border:1px solid #cbd5e1; border-radius:6px; background:#fff;
  color:#334155; font-size:0.6rem; font-weight:700; cursor:pointer;
}
.modo-btn i { font-size:0.92rem; color:#64748b; }
.modo-btn.active {
  border-color:#0f2a5c; background:#0f2a5c; color:#fff;
}
.modo-btn.active i { color:#c5e078; }
#gridBody tr.selected { background:#e8f0ff; }
#gridBody tr { cursor:pointer; }
.col-num { text-align:right; font-variant-numeric:tabular-nums; }
.col-check { text-align:center; }
.col-acoes {
  width:72px; white-space:nowrap; text-align:center;
}
.col-acoes .btn { padding: 0.12rem 0.28rem; }
#modalOverlay .modal-dialog { max-width: 560px; }
#modalOverlay .modal-header { padding: 0.92rem 1rem 0; gap: 0.6rem; }
#modalOverlay .modal-header h2 { font-size: 0.96rem; }
#modalOverlay .modal-close { font-size: 1.2rem; }
#modalOverlay .modal-body { padding: 0.8rem 1rem 0.92rem; }
#modalOverlay .modal-footer { gap: 0.4rem; padding: 0.8rem 1rem; }
#modalOverlay .form-label { font-size: 0.72rem; margin-bottom: 0.16rem; }
#modalOverlay .form-control {
  padding: 0.48rem 0.6rem;
  font-size: 0.8rem;
  border-radius: 0.3rem;
  min-height: 0;
  height: auto;
  line-height: 1.25;
}
#modalOverlay .form-control:focus { box-shadow: 0 0 0 2px rgba(27, 79, 156, 0.15); }
#modalOverlay .form-group { margin-bottom: 0.56rem; }
#modalOverlay .form-row { gap: 0.6rem; }
#modalOverlay .btn { gap: 0.32rem; padding: 0.56rem 1rem; font-size: 0.76rem; border-radius: 0.3rem; }
#modalOverlay .prod-check {
  display:flex; align-items:center; gap:0.4rem; margin:0.2rem 0 0;
  font-size:0.72rem; font-weight:600; color:#334155;
}
</style>

<script>
const ESTOQUES = {{ estoques|tojson }};
const UNIDADES = {{ unidades|tojson }};
const GRUPOS = {{ grupos|tojson }};
const PRODUTOS = {{ produtos|tojson }};
const ESTOQUE_ID = {{ estoque_id or 'null' }};
const GRUPO_ID = {{ grupo_id or 'null' }};

let modo = 'produtos';
let selectedId = null;
let cadastroId = null;

function fmt(n){
  const v = Number(vOr0(n));
  return v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function vOr0(n){ return (n===null||n===undefined||n==='') ? 0 : n; }
function esc(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function setModo(m){
  modo = m;
  document.getElementById('btnModoUnidades').classList.toggle('active', m==='unidades');
  document.getElementById('btnModoGrupos').classList.toggle('active', m==='grupos');
  document.getElementById('btnModoProdutos').classList.toggle('active', m==='produtos');
  document.getElementById('filtrosProdutos').style.display = m==='produtos' ? 'flex' : 'none';
  selectedId = null;
  renderGrid();
}

function trocarFiltros(){
  const e = document.getElementById('selEstoque').value;
  const g = document.getElementById('selGrupo').value;
  let url = '/nutricao/produtos?estoque_id=' + encodeURIComponent(e);
  if (g) url += '&grupo_id=' + encodeURIComponent(g);
  location.href = url;
}

function currentList(){
  if (modo === 'unidades') return UNIDADES;
  if (modo === 'grupos') return GRUPOS;
  return PRODUTOS;
}

function acoesHtml(id){
  return `<td class="col-acoes" onclick="event.stopPropagation()">
    <button class="btn btn-ghost btn-sm" type="button" title="Editar" onclick="editarLinha(${id})"><i class="fas fa-edit"></i></button>
    <button class="btn btn-ghost btn-sm" type="button" title="Excluir" onclick="excluirLinha(${id})"><i class="fas fa-trash"></i></button>
  </td>`;
}

function renderGrid(){
  const head = document.getElementById('gridHead');
  const body = document.getElementById('gridBody');
  if (modo === 'unidades'){
    head.innerHTML = '<tr><th>Código</th><th>Descrição</th><th style="width:64px;text-align:center">Ativo</th><th class="col-acoes">Ações</th></tr>';
    body.innerHTML = UNIDADES.map(u => rowUnidade(u)).join('') || emptyRow(4);
  } else if (modo === 'grupos'){
    head.innerHTML = '<tr><th>Grupo</th><th style="width:88px;text-align:center">Qtd. produtos</th><th style="width:64px;text-align:center">Ativo</th><th class="col-acoes">Ações</th></tr>';
    body.innerHTML = GRUPOS.map(g => rowGrupo(g)).join('') || emptyRow(4);
  } else {
    head.innerHTML = `<tr>
      <th>Grupo</th><th>Código</th><th>Descrição</th>
      <th class="col-num">Quantidade</th><th>Unidade</th>
      <th class="col-num">Preço médio</th><th class="col-num">Ult. preço</th>
      <th class="col-num">Quant. mín.</th><th class="col-num">Quant. máx.</th>
      <th class="col-num">Quant. líq.</th><th>Un. Liq.</th>
      <th class="col-check">FC</th>
      <th class="col-acoes">Ações</th>
    </tr>`;
    body.innerHTML = PRODUTOS.map(p => rowProduto(p)).join('') || emptyRow(13);
  }
  if (selectedId){
    const tr = body.querySelector(`tr[data-id="${selectedId}"]`);
    if (tr) tr.classList.add('selected');
  }
}

function emptyRow(cols){
  return `<tr><td colspan="${cols}" style="text-align:center;color:#64748b;padding:0.96rem;">Nenhum registro.</td></tr>`;
}

function rowUnidade(u){
  const sel = selectedId === u.id ? 'selected' : '';
  return `<tr class="${sel}" data-id="${u.id}" onclick="selecionar(${u.id})">
    <td>${esc(u.codigo)}</td><td>${esc(u.descricao)}</td>
    <td class="col-check">${u.ativo?'✓':''}</td>
    ${acoesHtml(u.id)}
  </tr>`;
}

function rowGrupo(g){
  const sel = selectedId === g.id ? 'selected' : '';
  return `<tr class="${sel}" data-id="${g.id}" onclick="selecionar(${g.id})">
    <td>${esc(g.nome)}</td>
    <td class="col-num" style="text-align:center">${g.qtd_produtos||0}</td>
    <td class="col-check">${g.ativo?'✓':''}</td>
    ${acoesHtml(g.id)}
  </tr>`;
}

function unOpts(sel){
  return UNIDADES.filter(u=>u.ativo!==false).map(u =>
    `<option value="${esc(u.codigo)}" ${u.codigo===sel?'selected':''}>${esc(u.codigo)}</option>`
  ).join('');
}
function grupoOpts(sel){
  return GRUPOS.filter(g=>g.ativo!==false).map(g =>
    `<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(g.nome)}</option>`
  ).join('');
}

function rowProduto(p){
  const sel = selectedId === p.id ? 'selected' : '';
  return `<tr class="${sel}" data-id="${p.id}" onclick="selecionar(${p.id})">
    <td>${esc(p.grupo)}</td>
    <td>${esc(p.codigo)}</td>
    <td>${esc(p.descricao)}</td>
    <td class="col-num">${fmt(p.quantidade)}</td>
    <td>${esc(p.unidade)}</td>
    <td class="col-num">${fmt(p.preco_medio)}</td>
    <td class="col-num">${fmt(p.ult_preco)}</td>
    <td class="col-num">${fmt(p.quant_min)}</td>
    <td class="col-num">${fmt(p.quant_max)}</td>
    <td class="col-num">${p.quant_liq ? fmt(p.quant_liq) : ''}</td>
    <td>${esc(p.un_liq||'')}</td>
    <td class="col-check">${p.fc?'X':''}</td>
    ${acoesHtml(p.id)}
  </tr>`;
}

function selecionar(id){
  selectedId = id;
  renderGrid();
}

function prepararFooterModal(){
  document.getElementById('modalConfirmBtn').innerHTML = '<i class="fas fa-save"></i> Gravar';
  const sec = document.querySelector('#modalFooter .btn-secondary');
  if (sec) sec.innerHTML = '<i class="fas fa-door-open"></i> Fechar';
}

function htmlUnidade(item){
  const u = item || {};
  return `
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Código *</label>
        <input class="form-control" id="f-un-codigo" maxlength="20" value="${esc(u.codigo||'')}">
      </div>
      <div class="form-group">
        <label class="form-label">Descrição</label>
        <input class="form-control" id="f-un-desc" value="${esc(u.descricao||'')}">
      </div>
    </div>
    <label class="prod-check"><input type="checkbox" id="f-un-ativo" ${u.ativo!==false?'checked':''}> Ativo</label>`;
}

function htmlGrupo(item){
  const g = item || {};
  return `
    <div class="form-group">
      <label class="form-label">Grupo *</label>
      <input class="form-control" id="f-gr-nome" value="${esc(g.nome||'')}">
    </div>
    <label class="prod-check"><input type="checkbox" id="f-gr-ativo" ${g.ativo!==false?'checked':''}> Ativo</label>`;
}

function htmlProduto(item){
  const p = item || {};
  const g = p.grupo_id || GRUPO_ID || (GRUPOS.find(x=>x.ativo!==false)||{}).id;
  return `
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Grupo *</label>
        <select class="form-control" id="f-prod-grupo">${grupoOpts(g)}</select>
      </div>
      <div class="form-group">
        <label class="form-label">Código *</label>
        <input class="form-control" id="f-prod-codigo" value="${esc(p.codigo||'')}">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Descrição *</label>
      <input class="form-control" id="f-prod-desc" value="${esc(p.descricao||'')}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Quantidade</label>
        <input class="form-control" type="number" step="any" id="f-prod-qtd" value="${vOr0(p.quantidade)}">
      </div>
      <div class="form-group">
        <label class="form-label">Unidade</label>
        <select class="form-control" id="f-prod-un">${unOpts(p.unidade||'UN')}</select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Preço médio</label>
        <input class="form-control" type="number" step="any" id="f-prod-preco" value="${item ? vOr0(p.preco_medio) : 0.01}">
      </div>
      <div class="form-group">
        <label class="form-label">Ult. preço</label>
        <input class="form-control" type="number" step="any" id="f-prod-ult" value="${item ? vOr0(p.ult_preco) : 0.01}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Quant. mín.</label>
        <input class="form-control" type="number" step="any" id="f-prod-min" value="${vOr0(p.quant_min)}">
      </div>
      <div class="form-group">
        <label class="form-label">Quant. máx.</label>
        <input class="form-control" type="number" step="any" id="f-prod-max" value="${vOr0(p.quant_max)}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Quant. líq.</label>
        <input class="form-control" type="number" step="any" id="f-prod-liq" value="${vOr0(p.quant_liq)}">
      </div>
      <div class="form-group">
        <label class="form-label">Un. Liq.</label>
        <select class="form-control" id="f-prod-unliq">${unOpts(p.un_liq||'NC')}</select>
      </div>
    </div>
    <label class="prod-check"><input type="checkbox" id="f-prod-fc" ${p.fc?'checked':''}> FC</label>`;
}

function abrirCadastro(item){
  cadastroId = item && item.id ? item.id : null;
  const isEdit = !!cadastroId;
  let titulo, html;
  if (modo === 'unidades'){
    titulo = isEdit ? 'Editar unidade' : 'Nova unidade';
    html = htmlUnidade(item);
  } else if (modo === 'grupos'){
    titulo = isEdit ? 'Editar grupo' : 'Novo grupo';
    html = htmlGrupo(item);
  } else {
    if (!ESTOQUE_ID){ showToast('Selecione um estoque','error'); return; }
    titulo = isEdit ? 'Editar produto' : 'Novo produto';
    html = htmlProduto(item);
  }
  abrirModal(titulo, html, 'Gravar', gravarCadastro);
  prepararFooterModal();
}

function novoItem(){
  abrirCadastro(null);
}

function editarLinha(id){
  const item = currentList().find(x => x.id === id);
  if (!item){ showToast('Registro não encontrado','error'); return; }
  selectedId = id;
  renderGrid();
  abrirCadastro(item);
}

function collectUnidade(){
  return {
    codigo: (document.getElementById('f-un-codigo')?.value||'').trim().toUpperCase(),
    descricao: (document.getElementById('f-un-desc')?.value||'').trim().toUpperCase(),
    ativo: !!document.getElementById('f-un-ativo')?.checked
  };
}
function collectGrupo(){
  return {
    nome: (document.getElementById('f-gr-nome')?.value||'').trim().toUpperCase(),
    ativo: !!document.getElementById('f-gr-ativo')?.checked
  };
}
function collectProduto(){
  return {
    estoque_id: ESTOQUE_ID,
    grupo_id: parseInt(document.getElementById('f-prod-grupo')?.value||0,10),
    codigo: (document.getElementById('f-prod-codigo')?.value||'').trim().toUpperCase(),
    descricao: (document.getElementById('f-prod-desc')?.value||'').trim().toUpperCase(),
    quantidade: parseFloat(document.getElementById('f-prod-qtd')?.value)||0,
    unidade: document.getElementById('f-prod-un')?.value || 'UN',
    preco_medio: parseFloat(document.getElementById('f-prod-preco')?.value)||0,
    ult_preco: parseFloat(document.getElementById('f-prod-ult')?.value)||0,
    quant_min: parseFloat(document.getElementById('f-prod-min')?.value)||0,
    quant_max: parseFloat(document.getElementById('f-prod-max')?.value)||0,
    quant_liq: parseFloat(document.getElementById('f-prod-liq')?.value)||0,
    un_liq: document.getElementById('f-prod-unliq')?.value || 'NC',
    fc: !!document.getElementById('f-prod-fc')?.checked,
    ativo: true
  };
}

async function gravarCadastro(){
  let body, url, method;
  if (modo === 'unidades'){
    body = collectUnidade();
    if (!body.codigo){ showToast('Informe o código','error'); return; }
    url = cadastroId ? `/nutricao/api/unidades/${cadastroId}` : '/nutricao/api/unidades';
    method = cadastroId ? 'PUT' : 'POST';
  } else if (modo === 'grupos'){
    body = collectGrupo();
    if (!body.nome){ showToast('Informe o grupo','error'); return; }
    url = cadastroId ? `/nutricao/api/grupos-produto/${cadastroId}` : '/nutricao/api/grupos-produto';
    method = cadastroId ? 'PUT' : 'POST';
  } else {
    body = collectProduto();
    if (!body.codigo || !body.descricao){ showToast('Código e descrição são obrigatórios','error'); return; }
    if (!body.grupo_id){ showToast('Selecione o grupo','error'); return; }
    url = cadastroId ? `/nutricao/api/produtos/${cadastroId}` : '/nutricao/api/produtos';
    method = cadastroId ? 'PUT' : 'POST';
  }
  const r = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok || j.ok === false){ showToast((j && j.error) || 'Falha ao gravar','error'); return; }
  showToast('Gravado','success');
  fecharModal();
  setTimeout(() => location.reload(), 350);
}

async function excluirLinha(id){
  if (!confirm('Desativar este registro?')) return;
  let url;
  if (modo === 'unidades') url = `/nutricao/api/unidades/${id}`;
  else if (modo === 'grupos') url = `/nutricao/api/grupos-produto/${id}`;
  else url = `/nutricao/api/produtos/${id}`;
  const r = await fetch(url, { method:'DELETE' });
  const j = await r.json();
  if (!r.ok || j.ok === false){ showToast((j && j.error) || 'Falha','error'); return; }
  showToast('Desativado','success');
  setTimeout(() => location.reload(), 350);
}

document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  const ov = document.getElementById('modalOverlay');
  if (ov && ov.style.display === 'flex') fecharModal();
});

setModo('produtos');
</script>
{% endblock %}
